id = "gronsak/insomnia"
name = "Insomnia"
version = "1.0.2"
min_noctalia = "5.0.0"
plugin_api = 3
author = "gronsak"
license = "MIT"
icon = "bed-off"
description = "Keep the laptop awake when its lid is closed, so background jobs can continue running."
tags = ["bar", "shortcut", "system", "productivity", "utility"]
dependencies = ["systemctl", "systemd-run", "systemd-inhibit", "sleep"]

[[service]]
id = "insomnia-service"
entry = "service.luau"

[[widget]]
id = "insomnia"
entry = "widget.luau"

[[shortcut]]
id = "insomnia-toggle"
entry = "shortcut.luau"
